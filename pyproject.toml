[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mag-agent"
version = "0.35.0"
description = "MagAgent — CLI AI coding agent with persistent MagGraph memory. Like the Magpie: intelligent, tool-using, and never forgets."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Merced", email = "alexmerced@hey.com" }]
requires-python = ">=3.11"
keywords = [
    "ai", "agent", "cli", "coding", "maggraph", "memory", "llm",
    "coding-assistant", "terminal", "corvid", "magpie",
    "slack", "discord", "telegram", "gateway",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core CLI & UI
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    # LLM providers
    "litellm>=1.40.0",
    # Memory graph
    "maggraph>=0.4.1",
    # Config
    "tomli-w>=1.0.0",
    # Required by the MCP SDK and imported directly by the streamable-http
    # transport in mcp/bridge.py.
    "httpx2>=2.0.0; python_version >= '3.11'",
    # HTTP
    "httpx>=0.27.0",
    # Skills parsing
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    # Git integration
    "gitpython>=3.1.40",
    # Async file I/O
    "aiofiles>=23.0.0",
    # Web search (real results, no API key)
    "ddgs>=9.0.0",
    # Clean article text extraction from URLs
    "trafilatura>=1.12",
    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Image tools
    "Pillow>=10.0",
    # JSON path queries
    "jmespath>=1.0",
    # Clipboard read/write
    "pyperclip>=1.8",
    # System metrics (CPU, RAM, disk)
    "psutil>=5.9",
    # Desktop notifications (cross-platform)
    "plyer>=2.1",
    # Document generation
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "docxtpl>=0.18",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    # Template engine
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Parallel test execution: the suite is dominated by subprocess-spawning
    # tests, so it scales well across workers.
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
gateway = [
    "slack-bolt>=1.18",
    "discord.py>=2.3",
    "python-telegram-bot>=21.0",
]
mcp = [
    "mcp[cli]>=2.0,<3",
]
browser = [
    "playwright>=1.45.0",
]

[project.scripts]
magent = "magent.cli.main:app"

[project.urls]
Homepage = "https://github.com/AlexMercedCoder/MagAgent"
Repository = "https://github.com/AlexMercedCoder/MagAgent"
Issues = "https://github.com/AlexMercedCoder/MagAgent/issues"
Documentation = "https://github.com/AlexMercedCoder/MagAgent#readme"
Changelog = "https://github.com/AlexMercedCoder/MagAgent/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/magent"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# `strict = true` produced 634 errors in 56 files, so `make lint` could never
# pass and the type gate was never run in CI — worse than having none. This is
# a passing baseline that CI enforces, plus a ratchet: modules listed under
# `[[tool.mypy.overrides]]` below are the backlog. Move a module off that list
# once it type-checks, and it can never regress afterwards.
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false

# Ratchet backlog: modules that do not yet pass the baseline.
# Shrink this list; do not grow it.
[[tool.mypy.overrides]]
module = [
    "magent.agent",
    "magent.agent_defs",
    "magent.agraph.criteria",
    "magent.agraph.execute",
    "magent.agraph.mappings",
    "magent.agraph.plan",
    "magent.cli.command_context",
    "magent.cli.commands.graph",
    "magent.cli.commands.permissions",
    "magent.cli.commands.plugins",
    "magent.cli.main",
    "magent.config",
    "magent.config_safety",
    "magent.daemon",
    "magent.gateway.adapters.slack",
    "magent.gateway.router",
    "magent.goal_orchestrator",
    "magent.mcp.bridge",
    "magent.memory",
    "magent.model_capabilities",
    "magent.prompt_input",
    "magent.session_controls",
    "magent.tools.executor",
    "magent.tools.web",
    "magent.utils",
    "magent.workbench",
    "magent.workbench_maintenance",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["magent"]
omit = [
    "src/magent/gateway/adapters/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet: raise this as coverage improves, never lower it. The new
# regression suites (classifier bypasses, CLI surface, durability, safe names)
# lifted the measured figure, so the floor moves up with them.
fail_under = 64
