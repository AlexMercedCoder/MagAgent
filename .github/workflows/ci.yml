name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v6
        if: matrix.python-version == '3.12'
        with:
          node-version: "22"

      - name: Install TypeScript language server
        if: matrix.python-version == '3.12'
        run: npm install --global typescript@5.9.3 typescript-language-server

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,full]"

      - name: Install release-candidate audit tooling
        if: matrix.python-version == '3.12'
        run: python -m pip install pip-audit

      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.12'
        run: python -m pip_audit . --format json --output dependency-audit.json

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        # The gate `make lint` runs. It was never in CI while it could not
        # pass; it passes now, so a regression fails the build.
        if: matrix.python-version == '3.12'
        run: python -m mypy src/magent

      - name: Unit tests
        # -n auto: the suite is subprocess-heavy and parallelises well.
        run: python -m pytest tests/unit -q -n auto

      - name: MCP integration tests
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/integration -q

      - name: Offline real-agent reliability evals
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          from magent.agent_evals import run_agent_eval_suite, write_agent_eval_report

          report = run_agent_eval_suite(".", "evals/reliability-offline.json")
          write_agent_eval_report(report, "agent-eval-report.json")
          print(f"passed={report['passed']}/{report['total']} artifacts={report['artifact_passed']}/{report['artifact_total']}")
          raise SystemExit(0 if report["ok"] else 1)
          PY

      - name: Upload reliability evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: agent-eval-report-${{ matrix.python-version }}
          path: agent-eval-report.json
          if-no-files-found: error

      - name: Documentation drift check
        run: |
          python - <<'PY'
          from typer.testing import CliRunner
          from magent.cli.main import app

          result = CliRunner().invoke(app, ["docs", "generate-reference", "--check"])
          print(result.output)
          raise SystemExit(result.exit_code)
          PY

      - name: Security assurance probes
        if: matrix.python-version == '3.12'
        run: magent system security-report --output security-assurance.json

      - name: Contract and migration assurance
        if: matrix.python-version == '3.12'
        run: |
          magent system compatibility > contract-inventory.json
          magent system migrate --root /tmp/magent-ci-state --apply > migration-acceptance.json

      - name: Memory quality and performance gates
        if: matrix.python-version == '3.12'
        run: |
          magent user create ci
          magent eval memory evals/memory-quality-v2.json --memory-dir evals/fixtures/memory-demo --project demo --report-out memory-quality.json
          magent performance budget --profile quick --project . --report-out performance-budget.json

      - name: Upload security evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: security-assurance-${{ matrix.python-version }}
          path: security-assurance.json
          if-no-files-found: error

      - name: Upload daily-driver evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: daily-driver-evidence-${{ matrix.python-version }}
          path: |
            memory-quality.json
            performance-budget.json
          if-no-files-found: error

      - name: Coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/unit tests/integration --cov=magent --cov-report=term-missing:skip-covered

      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Supply-chain evidence
        if: matrix.python-version == '3.12'
        run: |
          magent release supply-chain --project . --artifact dist/mag_agent-*.whl --artifact dist/mag_agent-*.tar.gz --audit-report dependency-audit.json --out-dir supply-chain

      - name: Upload release-candidate evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-evidence-${{ matrix.python-version }}
          path: |
            dependency-audit.json
            contract-inventory.json
            migration-acceptance.json
            supply-chain/
          if-no-files-found: error

      - name: Core wheel smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/magent-core
          /tmp/magent-core/bin/python -m pip install dist/*.whl
          /tmp/magent-core/bin/magent --version
          /tmp/magent-core/bin/magent tools doctor

  packaged-acceptance:
    name: Packaged acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: python -m pip install --upgrade pip build pytest pytest-asyncio Pillow && python -m build --wheel
      - name: Install public-shape wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
      - name: CLI and security smoke
        run: |
          magent --version
          magent tools doctor
          magent system security-report
      - name: Cross-platform contract tests
        run: python -m pytest -q tests/unit/test_permissions_bypass.py tests/unit/test_safe_names.py tests/unit/test_durability_and_state.py tests/unit/test_auth_store.py tests/unit/test_tools_safety.py tests/unit/test_provider_support.py tests/unit/test_security_assurance.py -k "not document_tools_create_docx_and_pptx and not visual_artifact_tools_create_svg_diagram_and_image"
